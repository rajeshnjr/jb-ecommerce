<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JB | Premium Clothing</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <header class="bg-black text-white text-center py-20 px-4">
        <h1 class="text-5xl font-bold tracking-widest mb-4">JB</h1>
        <p class="text-xl max-w-2xl mx-auto font-light text-gray-300">
            Crafting high-quality, timeless apparel. Elevate your everyday wardrobe with our signature collections.
        </p>
    </header>
    <main class="max-w-7xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
        <h2 class="text-3xl font-extrabold mb-8">New Arrivals</h2>
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
        </div>
    </main>
    <script>
        async function fetchProducts() {
            try {
                const response = await fetch('http://localhost:8000/api/products');
                const products = await response.json();
                const grid = document.getElementById('product-grid');
                grid.innerHTML = products.map(product => `
                    <div class="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden hover:shadow-lg transition">
                        <img src="${product.image_url || 'https://via.placeholder.com/400x500'}" alt="${product.name}" class="w-full h-64 object-cover">
                        <div class="p-6">
                            <h3 class="font-bold text-lg mb-2">${product.name}</h3>
                            <p class="text-gray-600 mb-4 font-medium">₹${product.price.toFixed(2)}</p>
                            <div class="mb-4">
                                <span class="text-xs text-gray-500 uppercase tracking-wide">Sizes</span>
                                <div class="flex gap-2 mt-1">
                                    ${product.available_sizes.map(size => `<span class="px-2 py-1 border text-xs rounded">${size}</span>`).join('')}
                                </div>
                            </div>
                            <button class="w-full bg-black text-white py-2 rounded font-semibold hover:bg-gray-800 transition">
                                Add to Cart
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error("Failed to load products:", error);
            }
        }
        fetchProducts();
    </script>
</body>
</html>
